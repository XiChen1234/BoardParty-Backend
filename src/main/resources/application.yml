server:
  port: 8080
  servlet:
    context-path: /board-party/api

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      # 开启文件上传
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: ""

jwt:
  secret: ${JWT_SECRET:veryveryveryveryveryveryverysecurekey} # 示例密钥
