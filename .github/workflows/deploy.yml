name: 部署后端项目

on:
  push:
    branches: [ master ] # 指定触发分支，当代码推送到 main 分支时触发工作流

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # 工作流在最新的Ubuntu系统环境中运行

    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v3

      - name: 设置Java环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 构建jar包
        run: mvn clean package

      - name: 添加服务器主机密钥到known_hosts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: 部署到服务器
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          mkdir -p ~/board-party/backend

          # 同步 jar 文件到用户目录
          rsync -avz -e "ssh -i ~/.ssh/id_rsa" target/*.jar "$SERVER_USER@$SERVER_HOST":~/board-party/backend/

          # 远程重启 Spring Boot 服务 - 先停止旧进程，再以后台方式启动
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" \
            "cd ~/board-party/backend && lsof -ti:8080 | xargs kill -9 2>/dev/null; nohup java -jar *.jar --spring.profiles.active=prod > app.log 2>&1 &"